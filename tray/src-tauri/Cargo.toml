[package]
name = "androidtv-tray"
version = "0.1.0"
description = "Menubar and system-tray remote for Android TV devices managed by the Android TV Remote appliance"
authors = ["Yolan"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "androidtv_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2.4.4"
tauri-plugin-global-shortcut = "2.3.2"
