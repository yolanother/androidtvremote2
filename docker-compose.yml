#
# Production compose stack for the Android TV Remote appliance. Runs the single appliance
# image on the host network so that mDNS/DNS-SD discovery works (link-local multicast does
# not cross a Docker bridge) and bind-mounts the NFS-backed HOST_DATA_DIR onto DATA_DIR so
# the SQLite device registry and the per-device pairing certificates survive container
# restarts, rebuilds and image upgrades. The absence of that mount in the previous build
# is the reason pairing was lost on every restart. Every setting is read from .env; see
# .env.example for the full list.

services:
  androidtv-remote:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IMAGE_NAME:-androidtv-remote}:${IMAGE_TAG:-latest}
    container_name: androidtv-remote
    restart: unless-stopped

    # DO NOT "clean this up" to a bridge network with a ports: mapping.
    # mDNS/DNS-SD (`_androidtvremote2._tcp.local.`) is link-local multicast and CANNOT
    # cross a Docker bridge. On a bridge the discovery browser returns an empty list
    # forever -- no error, no log line -- which is exactly what the old build did. Host
    # mode is the only reason discovery works at all.
    # It also removes the need for a published port: PORT alone decides where we listen
    # (network_mode: host and ports: are mutually exclusive).
    # Linux only. On Docker Desktop use docker-compose.dev.yml, which is the bridge
    # variant with DISCOVERY_ENABLED=false and devices added by IP.
    network_mode: host

    environment:
      # Container-side data root. Keep this aligned with the mount target below.
      DATA_DIR: /volumes/androidtvremote
      PORT: ${PORT:-7433}
      HOST: ${HOST:-0.0.0.0}
      REMOTE_API_TOKEN: ${REMOTE_API_TOKEN:-}
      CLIENT_NAME: ${CLIENT_NAME:-Android TV Remote}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      DISCOVERY_INTERVAL: ${DISCOVERY_INTERVAL:-60}
      PROVIDER_URLS: ${PROVIDER_URLS:-}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-5}
      PROVIDER_POLL_INTERVAL: ${PROVIDER_POLL_INTERVAL:-15}
      # Advisory only: the HTTPS origin the UI points phones at to install the PWA,
      # since a browser will not install one served from http://<lan-ip>.
      PUBLIC_URL: ${PUBLIC_URL:-}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

    # Runs as a non-root uid. It MUST be able to write HOST_DATA_DIR: if the host
    # directory (or NFS export) is owned by a different uid, set PUID/PGID in .env to
    # match rather than loosening the directory's permissions. The entrypoint's write
    # probe turns any mismatch into a loud boot failure instead of lost pairings.
    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      # THE durability fix. Host path is configurable; the container path is fixed and
      # must match DATA_DIR above. Without this line every pairing is lost on restart.
      - ${HOST_DATA_DIR:-/volumes/androidtvremote}:/volumes/androidtvremote

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-7433}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
